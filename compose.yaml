services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
    image: urz-timetable:prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:3000"
    networks:
      - infra

networks:
  infra:
    external: true
